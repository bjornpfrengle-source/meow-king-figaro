<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report
         anything but 0. Without it, and with the native wrapper setting
         contentInsetAdjustmentBehavior = .never, the page runs edge to edge:
         the header sits under the status bar and the bottom nav sits inside
         the home-indicator gesture strip, where iOS eats the first tap. That
         is the "have to tap it two or three times" bug. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cat Chaos Arena</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
